# macOS-specific builder configurations and build commands

## Base configurations

.macos:
    image: "registry.hub.docker.com/kitware/macos-ci-images:macos-26-xcode-16.4-20260710"
    variables:
        GIT_CLONE_PATH: "$CI_BUILDS_DIR/paraview-ci"
        TART_EXECUTOR_HOST_DIR: "false"

### Build and test

.macos_arm64_replay:
    extends: .macos

    variables:
        CMAKE_CONFIGURATION: macos_arm64_replay
        CTEST_NO_WARNINGS_ALLOWED: 1
        CTEST_EXCLUSIONS: >-
          ^catalyst-impl-external-conduit$

.macos_x86_64_replay:
    extends: .macos

    variables:
        CMAKE_CONFIGURATION: macos_x86_64_replay
        CTEST_NO_WARNINGS_ALLOWED: 1

.macos_arm64_replay_wrappings:
    extends: .macos_arm64_replay

    variables:
        CMAKE_CONFIGURATION: macos_arm64_replay_wrappings
        CATALYST_SETUP_PYTHON_ENV: 1
        CTEST_EXCLUSIONS: >-
          ^catalyst-impl-external-conduit$

.macos_x86_64_replay_wrappings:
    extends: .macos_x86_64_replay

    variables:
        CMAKE_CONFIGURATION: macos_x86_64_replay_wrappings
        CATALYST_SETUP_PYTHON_ENV: 1

## Tags

.macos_x86_64_builder_tags:
    tags:
        - paraview
        - macos-x86_64
        - tart

.macos_arm64_builder_tags:
    tags:
        - paraview
        - macos-arm64
        - tart

## macOS-specific scripts

.before_script_macos: &before_script_macos
    - .gitlab/ci/cmake.sh
    - .gitlab/ci/ninja.sh
    - export PATH=$PWD/.gitlab:$PWD/.gitlab/cmake/bin:$PATH
    - cmake --version
    - ninja --version
    - .gitlab/ci/gtest.sh
    - '[ -n "$CATALYST_SETUP_PYTHON_ENV" ] && python3 -m venv venv && source venv/bin/activate && pip install numpy'

.cmake_build_test_macos:
    stage: build-test

    script:
        - *before_script_macos
        - ctest -VV -S .gitlab/ci/ctest_configure.cmake
        - ctest -VV -S .gitlab/ci/ctest_build.cmake
        - ctest --output-on-failure -V -S .gitlab/ci/ctest_test.cmake
    timeout: 15 minutes
