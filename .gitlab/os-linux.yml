# Linux-specific builder configurations and build commands

## Base images

.fedora43:
    image: "kitware/paraview:ci-catalyst-fedora43-20260304"
    variables:
        GIT_CLONE_PATH: $CI_BUILDS_DIR/gitlab-kitware-sciviz-ci

.fedora43_x86_64:
    extends:
        - .fedora43

### intel "classic" compilers
.el8_x86_64_icc:
    image: "kitware/paraview:ci-catalyst-el8-icc-x86_64-20260305"
    variables:
        CC: icc
        CXX: icpc
        FC: ifort

### intel oneAPI compilers
.el8_x86_64_icx:
    image: "kitware/paraview:ci-catalyst-el8-icx-x86_64-20260305"
    variables:
        CC: icx
        CXX: icpx
        FC: ifx

.fedora_mpich_addon:
    variables:
        MODULES: mpi/mpich-x86_64
        # Even with SHM size of 512m, SIGBUS still happened. Let's just use the
        # network instead for reliability.
        # https://wiki.mpich.org/mpich/index.php/Frequently_Asked_Questions#Q:_Why_MPI_Put_raises_SIGBUS_error_inside_docker.3F
        MPIR_CVAR_NOLOCAL: 1
        # Tell libfabric to NOT use psm3 (potentially use sockets) to adhere to the MPIR_CVAR_NOLOCAL
        FI_PROVIDER: "^psm3"
        # Fails inside of CI containers.
        PSM3_KASSIST_MODE: none

.fedora_extdeps_addon:
    variables:
        CMAKE_PREFIX_PATH: "/opt/conduit/basic"

.fedora_extdeps_wrappings_addon:
    variables:
        CMAKE_PREFIX_PATH: "/opt/conduit/wrapped"

.fedora43_x86_64_basic:
    extends:
        - .fedora43_x86_64

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64

.fedora43_aarch64:
    extends:
        - .fedora43

    variables:
        CMAKE_CONFIGURATION: fedora43_aarch64
        CTEST_EXCLUSIONS: >-
          ^t_conduit_node_set$

.fedora43_ppc64le:
    extends:
        - .fedora43
    variables:
      CMAKE_CONFIGURATION: fedora43_ppc64le
      CTEST_SITE: "UO Frank cluster"
      GIT_CLONE_PATH: null
      SYSTEM_BUILDTOOLS: "true"

.fedora43_x86_64_replay:
    extends:
        - .fedora43_x86_64

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_replay

.fedora43_x86_64_mpi_replay:
    extends:
        - .fedora43_x86_64
        - .fedora_mpich_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_mpi_replay

.fedora43_x86_64_extdeps_replay:
    extends:
        - .fedora43_x86_64
        - .fedora_extdeps_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_extdeps_replay

.fedora43_x86_64_extdeps_mpi_replay:
    extends:
        - .fedora43_x86_64
        - .fedora_extdeps_addon
        - .fedora_mpich_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_extdeps_mpi_replay

.fedora43_x86_64_tidy:
    extends:
        - .fedora43_x86_64

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_tidy
        CTEST_NO_WARNINGS_ALLOWED: 1

.fedora43_x86_64_mpi_replay_tidy:
    extends:
        - .fedora43_x86_64
        - .fedora_mpich_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_mpi_replay_tidy
        CTEST_NO_WARNINGS_ALLOWED: 1

.fedora43_x86_64_extdeps_mpi_replay_tidy:
    extends:
        - .fedora43_x86_64
        - .fedora_extdeps_addon
        - .fedora_mpich_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_extdeps_mpi_replay_tidy
        CTEST_NO_WARNINGS_ALLOWED: 1

.fedora43_x86_64_memcheck:
    extends: .fedora43_x86_64

    variables:
        CMAKE_BUILD_TYPE: RelWithDebInfo

.fedora_asan_addon:
    variables:
        CTEST_MEMORYCHECK_TYPE: AddressSanitizer
        # Disable LeakSanitizer for now. It's catching all kinds of errors that
        # need investigated or suppressed.
        CTEST_MEMORYCHECK_SANITIZER_OPTIONS: detect_leaks=0

.fedora_ubsan_addon:
    variables:
        CTEST_MEMORYCHECK_TYPE: UndefinedBehaviorSanitizer

.fedora43_x86_64_asan:
    extends:
        - .fedora43_x86_64_memcheck
        - .fedora_asan_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_asan

.fedora43_x86_64_ubsan:
    extends:
        - .fedora43_x86_64_memcheck
        - .fedora_ubsan_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_ubsan

.fedora43_x86_64_asan_mpi_replay:
    extends:
        - .fedora43_x86_64_memcheck
        - .fedora_asan_addon
        - .fedora_mpich_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_asan_mpi_replay

.fedora43_x86_64_mpi_replay_ubsan:
    extends:
        - .fedora43_x86_64_memcheck
        - .fedora_ubsan_addon
        - .fedora_mpich_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_mpi_replay_ubsan

.fedora43_x86_64_wrappings:
    extends:
        - .fedora43_x86_64

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_wrappings

.fedora43_x86_64_replay_wrappings:
    extends:
        - .fedora43_x86_64

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_replay_wrappings

.fedora43_x86_64_mpi_replay_wrappings:
    extends:
        - .fedora43_x86_64
        - .fedora_mpich_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_mpi_replay_wrappings

.fedora43_x86_64_extdeps_replay_wrappings:
    extends:
        - .fedora43_x86_64
        - .fedora_extdeps_wrappings_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_extdeps_replay_wrappings

.fedora43_x86_64_extdeps_mpi_replay_wrappings:
    extends:
        - .fedora43_x86_64
        - .fedora_extdeps_wrappings_addon
        - .fedora_mpich_addon

    variables:
        CMAKE_CONFIGURATION: fedora43_x86_64_extdeps_mpi_replay_wrappings

.el8_x86_64_icc_replay_wrappings:
    extends:
        - .el8_x86_64_icc

    variables:
        CMAKE_CONFIGURATION: el8_x86_64_icc_replay_wrappings

.el8_x86_64_icx_replay_wrappings:
    extends:
        - .el8_x86_64_icx

    variables:
        CMAKE_CONFIGURATION: el8_x86_64_icx_replay_wrappings

.el8_x86_64_icc_extdeps_replay_wrappings:
    extends:
        - .el8_x86_64_icc
        - .fedora_extdeps_wrappings_addon

    variables:
        CMAKE_CONFIGURATION: el8_x86_64_icc_extdeps_replay_wrappings

.el8_x86_64_icx_extdeps_replay_wrappings:
    extends:
        - .el8_x86_64_icx
        - .fedora_extdeps_wrappings_addon

    variables:
        CMAKE_CONFIGURATION: el8_x86_64_icx_extdeps_replay_wrappings

