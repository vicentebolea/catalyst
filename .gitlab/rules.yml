# Rules for where jobs can run

###
## Job variables:
##   CATALYST_CI_INSTANCE
##     Set to the URL of the instance the job should run on. Defaults to
##     `gitlab.kitware.com`.
####

variables:
    CATALYST_CI_INSTANCE: "gitlab.kitware.com"

# When to even consider running a pipeline
workflow:
    rules:
        # Run for merge requests.
        - if: '$CI_MERGE_REQUEST_ID'
          when: always
          auto_cancel:
              # Cancel all pipeline jobs if a new commit comes in on the branch/tag.
              on_new_commit: interruptible
        # If this is not a MR, do not run for other projects.
        - if: '$CI_PROJECT_PATH != "paraview/catalyst"'
          when: never
        # Run for schedules.
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
          when: always
          auto_cancel:
              # Never cancel scheduled pipelines because of new commits
              on_new_commit: none
        # Run for protected branches.
        - if: '$CI_COMMIT_REF_PROTECTED == "true"'
          when: always
          auto_cancel:
              # Cancel all pipeline jobs if a new commit comes in on the branch.
              on_new_commit: interruptible
        # Run for tags.
        - if: '$CI_COMMIT_TAG'
          when: always
        # Skip pipelines in all other cases
        - when: never

.run_automatically_spack:
    rules:
        - if: '$CI_SERVER_HOST == "gitlab.spack.io"'
          when: on_success
        - when: never

.release_only:
    rules:
      - if: '$CI_COMMIT_TAG && $CI_SERVER_HOST == "gitlab.kitware.com"'
        when: on_success
      - when: never

# Generic rules block to apply if the pipeline would be run
.rules:
    rules:
        # Skip jobs for other instances.
        - if: '$CI_SERVER_HOST != $CATALYST_CI_INSTANCE'
          when: never
        # Normal jobs run automatically.
        - if: '$CI_MERGE_REQUEST_ID'
          when: on_success
        # Jobs on a tag run right away.
        - if: '$CI_COMMIT_TAG'
          when: on_success
        # Jobs on a schedule run right away.
        - if: '$CI_PIPELINE_SOURCE == "schedule"'
          when: on_success
        # Normal jobs on the project run automatically.
        - when: on_success
