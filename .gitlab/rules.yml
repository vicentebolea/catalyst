# Rules for where jobs can run

.run_automatically:
    rules:
        - if: '$CI_PROJECT_PATH == "paraview/catalyst"'
          when: on_success
        - if: '$CI_MERGE_REQUEST_ID'
          when: on_success
        - when: never

.run_manually:
    rules:
        - if: '$CI_PROJECT_PATH == "paraview/catalyst"'
          when: delayed
          start_in: 30 minutes
        - if: '$CI_MERGE_REQUEST_ID'
          when: manual
        - when: never

.merged_only:
    rules:
        - if: '$CI_PROJECT_PATH == "paraview/catalyst"'
          when: on_success
        - when: never

.release_only:
    rules:
      - if: '$CI_COMMIT_TAG && $CI_PROJECT_PATH == "paraview/catalyst"'
        when: on_success
      - when: never
