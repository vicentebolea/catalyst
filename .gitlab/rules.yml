# Rules for where jobs can run

.run_automatically:
    rules:
        - if: '$CI_PROJECT_PATH == "paraview/catalyst" && $CI_SERVER_HOST == "gitlab.kitware.com"'
          when: on_success
        - if: '$CI_MERGE_REQUEST_ID && $CI_SERVER_HOST == "gitlab.kitware.com"'
          when: on_success
        - when: never

.run_automatically_spack:
    rules:
        - if: '$CI_PROJECT_PATH == "paraview/catalyst" && $CI_SERVER_HOST == "gitlab.spack.io"'
          when: on_success
        - when: never

.release_only:
    rules:
      - if: '$CI_COMMIT_TAG && $CI_PROJECT_PATH == "paraview/catalyst" && $CI_SERVER_HOST == "gitlab.kitware.com"'
        when: on_success
      - when: never
