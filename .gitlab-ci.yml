include:
    # Metadata shared my many jobs
    - local: .gitlab/rules.yml
    - local: .gitlab/artifacts.yml
    - local: .gitlab/release.yml
    - local: .gitlab/sync-github.yml

    # OS builds.
    - local: .gitlab/os-linux.yml
    - local: .gitlab/os-macos.yml
    - local: .gitlab/os-windows.yml
    - local: .gitlab/sync-github.yml

stages:
    - build-test
    - upload
    - release

################################################################################
# Job declarations
#
# Each job must pull in each of the following keys:
#
#   - a "base image"
#   - a build script
#   - tags for the jobs
#     - already provided for upload and CI update jobs
#   - rules for when to run the job
#
# Additionally, jobs may also contain:
#
#   - artifacts
#   - needs jobs for required jobs
################################################################################

# Release jobs

build-test:source:
    extends:
        - .create_source_archives
        - .release_artifacts
        - .linux_x86_64_builder_tags
        - .rules

upload:source:
    extends:
        - .upload_job
        - .rules
    variables:
        CATALYST_CI_RELEASE_ONLY: "true"
        UPLOAD_FILES: catalyst-*
    needs:
        - build-test:source
        # Ensure all builds and tests pass.
        - job: build:fedora43-x86_64-tidy
          artifacts: false
        - job: build:fedora43-x86_64-mpi-replay-tidy
          artifacts: false
        - job: build:fedora43-x86_64-extdeps-mpi-replay-tidy
          artifacts: false
        - job: build-test:fedora43-x86_64
          artifacts: false
        - job: build-test:fedora43-aarch64
          artifacts: false
        - job: build-test:fedora43-x86_64-replay
          artifacts: false
        - job: build-test:fedora43-x86_64-mpi-replay
          artifacts: false
        - job: build-test:fedora43-x86_64-extdeps-replay
          artifacts: false
        - job: build-test:fedora43-x86_64-extdeps-mpi-replay
          artifacts: false
        - job: build-test:fedora43-x86_64-asan
          artifacts: false
        - job: build-test:fedora43-x86_64-ubsan
          artifacts: false
        - job: build-test:fedora43-x86_64-asan-mpi-replay
          artifacts: false
        - job: build-test:fedora43-x86_64-mpi-replay-ubsan
          artifacts: false
        - job: build-test:macos-arm64-replay
          artifacts: false
        - job: build-test:macos-x86_64-replay
          artifacts: false
        - job: build-test:windows-vs2022-mpi-replay
          artifacts: false
        - job: build-test:windows-vs2022-replay
          artifacts: false

release:source:
    extends:
        - .release_job
        - .rules
    variables:
        CATALYST_CI_RELEASE_ONLY: "true"
    needs:
        - build-test:source
        - job: upload:source
          artifacts: false

